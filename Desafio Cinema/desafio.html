<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema</title>
    <link rel="stylesheet" href="desafio.css">
</head>

<body>
    <div class="container">
        <div class="sala">
            <h2>Por favor, escolha seu(s) assentos. </h2>

            <div id="plateia">
                <!-- Aqui dentro ficam as fileiras e assentos -->
            </div>

            <div class="painel">

                <h3>Assentos selecionados</h3>

                <p id="quantidade">0 assentos</p>

                <div id="lista-assentos">
                    <p>Nenhum selecionado</p>
                </div>

            </div>
        </div>
    </div>
</body>

<script>
    const plateia = document.getElementById("plateia");
    const quantidade = document.getElementById("quantidade");
    const listaAssentos = document.getElementById("lista-assentos");    

    // TODO: fazer com que a listagem de assentos seja dinâmica.
    // Exemplo: 
    // - Quero 3 fileiras de 40 cadeiras.
    // - Quero 4 fileiras de 10 cadeiras.

    const fileiras = 4;
    const assento = 10;

    for (let i = 1; i <= fileiras; i++) {
        const fileira = document.createElement('div');
        fileira.setAttribute('class', 'fileira');

        for (let j = 1; j <= assento; j++) {
            const botao = document.createElement('button');
            botao.setAttribute('class', 'assento');
            botao.style.backgroundColor = "white";
            botao.textContent = `${i}|${j}`;
            botao.onclick = function() {
                // verifica a cor atual
                if (this.style.backgroundColor == "green") {

                    // volta ao normal
                    this.style.backgroundColor = "white";

                } else {

                    // fica verde
                    this.style.backgroundColor = "green";
                }

                contarAssentos();
            }

            fileira.appendChild(botao);
        }

        plateia.appendChild(fileira);
    }

    function contarAssentos() {        
        const assentos = document.querySelectorAll(".assento");

        let contador = 0;
        let nomes = '';

        for (let i = 0; i < assentos.length; i++) {
            if (assentos[i].style.backgroundColor == "green") {
                contador++;
                nomes += assentos[i].innerHTML;
                nomes += " ";
            }
        }
        quantidade.innerHTML = contador + " assentos";
        listaAssentos.innerHTML = nomes;
    }
</script>

</html>
