<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta</title>
</head>

<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="cadastro.html">Cadastro</a>
    </nav>
    <hr>
    <table>
        <thread>
            <tr>
                <th>Id</th>
                <th>Descrição</th>
                <th>R$ Unitário</th>
                <th>Quantidade Disponível</th>
            </tr>
        </thread>
        <tbody>
            <!--preenchido pelo js-->
        </tbody>
    </table>

    <script>
        fetch('http://localhost:8080/produtos')
        .then(resp => resp.json())
        .then(dados => {
            dados.forEach(e => {
                let linha = `<tr><td>${e.id}</td>
                    <td>${e.descricao}</td>
                    <td>${e.preco}</td>
                    <td>${e.estoque}</td></tr>`
                document.getElementsByTagName('tbody')[0].innerHTML += linha    
            })
        })
    </script>
</body>

</html>
