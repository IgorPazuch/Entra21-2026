<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Produto</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
      }

      .container {
        max-width: 600px;
        margin: 60px auto;
        background: #ffffff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      }

      h1 {
        text-align: center;
        margin-bottom: 25px;
      }

      form {
        display: grid;
        gap: 15px;
      }

      .campo {
        display: grid;
        gap: 8px;
      }

      label {
        font-weight: 600;
      }

      input {
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 16px;
      }

      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      button:hover {
        background: #1d4ed8;
      }

      .lista {
        margin-top: 25px;
        border-top: 1px solid #e5e7eb;
        padding-top: 20px;
      }

      .lista h2 {
        font-size: 1.2rem;
        margin-bottom: 10px;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 10px;
      }

      li {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 10px 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Cadastro de Produto</h1>

      <form id="formProduto">
        <div class="campo">
          <label for="nome">Nome do produto</label>
          <input id="nome" name="nome" type="text" placeholder="Ex: Notebook" required />
        </div>

        <div class="campo">
          <label for="preco">Preço</label>
          <input id="preco" name="preco" type="number" step="0.01" min="0" placeholder="Ex: 2499.90" required />
        </div>

        <div class="campo">
          <label for="quantidade">Quantidade em estoque</label>
          <input id="quantidade" name="quantidade" type="number" min="0" placeholder="Ex: 10" required />
        </div>

        <button type="submit">Salvar produto</button>
      </form>

      <div class="lista">
        <h2>Produtos cadastrados</h2>
        <ul id="listaProdutos"></ul>
      </div>
    </div>

    <script>
      const formProduto = document.getElementById('formProduto');
      const listaProdutos = document.getElementById('listaProdutos');

      function carregarProdutos() {
        const produtos = JSON.parse(localStorage.getItem('produtos')) || [];
        listaProdutos.innerHTML = '';

        produtos.forEach((produto) => {
          const item = document.createElement('li');
          item.textContent = `${produto.nome} - R$ ${Number(produto.preco).toFixed(2)} - Estoque: ${produto.quantidade}`;
          listaProdutos.appendChild(item);
        });
      }

      formProduto.addEventListener('submit', function (event) {
        event.preventDefault();

        const nome = document.getElementById('nome').value.trim();
        const preco = document.getElementById('preco').value;
        const quantidade = document.getElementById('quantidade').value;

        if (!nome || !preco || !quantidade) {
          alert('Preencha todos os campos antes de salvar.');
          return;
        }

        const produtos = JSON.parse(localStorage.getItem('produtos')) || [];

        produtos.push({
          nome,
          preco: Number(preco),
          quantidade: Number(quantidade)
        });

        localStorage.setItem('produtos', JSON.stringify(produtos));
        formProduto.reset();
        carregarProdutos();
        alert('Produto salvo com sucesso!');
      });

      carregarProdutos();
    </script>
  </body>
</html>
